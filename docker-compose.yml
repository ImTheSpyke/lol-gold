name: lol-graph

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: harbor.imthespyke.fr/imthespyke/lol-graph:${IMAGE_TAG:-latest}
    container_name: lol-graph-app
    restart: unless-stopped
    init: true
    ports:
      - ${PORT:-3000}:3000
    environment:
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-lolgold}
      DB_PASSWORD: ${DB_PASSWORD:-lolgold}
      DB_NAME: ${DB_NAME:-btg_temp}
    volumes:
      - ./data:/app/data
      - ocr_models:/root/.cache/ppu-paddle-ocr
    depends_on:
      mariadb:
        condition: service_healthy
        required: false
    logging: *logging

  # Optional local database: docker compose --profile db up -d
  mariadb:
    profiles: [db]
    image: mariadb:11.8
    container_name: lol-graph-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_NAME:-btg_temp}
      MARIADB_USER: ${DB_USER:-lolgold}
      MARIADB_PASSWORD: ${DB_PASSWORD:-lolgold}
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - 127.0.0.1:${DB_PORT:-3306}:3306
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

volumes:
  mariadb_data:
  ocr_models:
