<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recent Games — lol-graph</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }

    header a { color: #3b82f6; text-decoration: none; font-size: 0.875rem; }
    header a:hover { text-decoration: underline; }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #f8fafc; }

    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      overflow: hidden;
    }

    thead {
      background: #0f172a;
    }

    th {
      text-align: left;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }

    td {
      padding: 0.875rem 1rem;
      border-top: 1px solid #334155;
      font-size: 0.875rem;
    }

    tr:hover td { background: #263045; }

    .uuid-cell {
      font-family: monospace;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .game-link {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
    }

    .game-link:hover { text-decoration: underline; }

    .no-name { color: #475569; font-style: italic; }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .pagination button {
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 0.875rem;
    }

    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pagination button:hover:not(:disabled) { background: #334155; }

    .pagination .page-info { font-size: 0.875rem; color: #94a3b8; }

    .loading { text-align: center; padding: 2rem; color: #64748b; }

    .empty { text-align: center; padding: 3rem; color: #475569; }
  </style>
</head>
<body>

<header>
  <a href="/">← Dashboard</a>
  <h1>Recent Games</h1>
</header>

<main>
  <div id="tableWrapper">
    <div class="loading">Loading…</div>
  </div>
  <div class="pagination">
    <button id="btnPrev" disabled>← Prev</button>
    <span class="page-info" id="pageInfo">Page 1</span>
    <button id="btnNext" disabled>Next →</button>
  </div>
</main>

<script>
  let currentPage = 1;
  const PER_PAGE  = 20;

  function formatDate(iso) {
    return new Date(iso).toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  }

  async function loadPage(page) {
    currentPage = page;
    const res   = await fetch(`/api/games?page=${page}&perPage=${PER_PAGE}`);
    const data  = await res.json();

    const wrapper = document.getElementById('tableWrapper');

    if (!data.games || data.games.length === 0) {
      wrapper.innerHTML = '<div class="empty">No games yet. Create one from the dashboard.</div>';
      document.getElementById('pageInfo').textContent = 'Page 0 / 0';
      document.getElementById('btnPrev').disabled = true;
      document.getElementById('btnNext').disabled = true;
      return;
    }

    const rows = data.games.map(g => `
      <tr>
        <td>
          <a class="game-link" href="/graph/${g.uuid}">
            ${g.name ? escHtml(g.name) : '<span class="no-name">(unnamed)</span>'}
          </a>
        </td>
        <td class="uuid-cell">${g.uuid}</td>
        <td>${formatDate(g.created_at)}</td>
        <td>
          <a class="game-link" href="/graph/${g.uuid}" style="font-size: 0.8rem;">View Graph</a>
        </td>
      </tr>
    `).join('');

    wrapper.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>UUID</th>
            <th>Created</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    const totalPages = data.totalPages || 1;
    document.getElementById('pageInfo').textContent = `Page ${page} / ${totalPages}`;
    document.getElementById('btnPrev').disabled = page <= 1;
    document.getElementById('btnNext').disabled = page >= totalPages;
  }

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  document.getElementById('btnPrev').addEventListener('click', () => loadPage(currentPage - 1));
  document.getElementById('btnNext').addEventListener('click', () => loadPage(currentPage + 1));

  loadPage(1);
</script>
</body>
</html>
