<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold Widget</title>
  <script src="/vendor/chart.js/chart.umd.min.js"></script>
  <script src="/static/smoothing.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    canvas { display: block; position: fixed; inset: 0; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <div id="app" data-game-uuid="{{GAME_UUID}}" data-smooth="{{SMOOTH}}"></div>
  <canvas id="goldChart"></canvas>

  <script>
  (function () {
    'use strict';

    const GAME_UUID = document.getElementById('app').dataset.gameUuid;
    const SMOOTH    = document.getElementById('app').dataset.smooth === '1';
    const POLL_MS   = 5000;

    function formatTime(t, duration) {
      if (duration < 120)       return t + 's';
      if (duration < 600)       return Math.floor(t / 60) + 'min';
      return Math.floor(t / 300) * 5 + 'min';
    }

    const canvas = document.getElementById('goldChart');
    const ctx    = canvas.getContext('2d');

    function syncSize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    syncSize();

    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels:   [],
        datasets: [{
          data:        [],
          borderWidth: 2,
          pointRadius: 0,
          tension:     0,
          fill: {
            target: { value: 0 },
            above:  'rgba(59,130,246,0.15)',
            below:  'rgba(239,68,68,0.15)',
          },
          segment: {
            borderColor: function (c) {
              return c.p0.parsed.y >= 0 ? '#3b82f6' : '#ef4444';
            },
          },
        }],
      },
      options: {
        responsive:          false,
        animation:           false,
        maintainAspectRatio: false,
        layout: { padding: 16 },
        interaction: { intersect: false, mode: 'index' },
        scales: {
          x: {
            type:  'category',
            ticks: { maxTicksLimit: 12, autoSkip: true, color: '#64748b', maxRotation: 0 },
            grid:  { color: '#1e293b' },
          },
          y: {
            ticks: {
              color: '#64748b',
              callback: function (v) {
                return (Number(v) > 0 ? '+' : '') + Number(v).toFixed(1) + 'k';
              },
            },
            grid: {
              color: function (c) {
                return c.tick.value === 0 ? '#475569' : '#1e293b';
              },
            },
            afterDataLimits: function (scale) {
              const extent = Math.max(1, scale.max, -scale.min);
              scale.max =  extent;
              scale.min = -extent;
            },
          },
        },
        plugins: {
          legend:  { display: false },
          tooltip: {
            backgroundColor: '#1e293b',
            borderColor:     '#334155',
            borderWidth:     1,
            titleColor:      '#94a3b8',
            bodyColor:       '#e2e8f0',
            callbacks: {
              title: function (items) { return items[0].label; },
              label: function (c) {
                const v = c.parsed.y;
                return (v > 0 ? 'Blue +' : 'Red +') + Math.abs(v).toFixed(1) + 'k';
              },
            },
          },
        },
      },
    });

    window.addEventListener('resize', function () {
      syncSize();
      chart.resize(window.innerWidth, window.innerHeight);
    });

    const poller = new Worker('/static/poll-worker.js');
    poller.onmessage = function (e) { if (e.data.type === 'tick') fetchAndUpdate(); };

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') fetchAndUpdate();
    });

    async function fetchAndUpdate() {
      try {
        const res  = await fetch('/api/graph/' + GAME_UUID + '/data');
        const data = await res.json();
        if (!data.readings || !data.readings.length) return;
        const rawDiffs = data.readings.map(function (r) { return r.diff; });
        const diffs    = SMOOTH ? gaussianSmooth(rawDiffs) : rawDiffs;
        const duration = data.readings[data.readings.length - 1].t;
        const labels   = data.readings.map(function (r) { return formatTime(r.t, duration); });
        chart.data.labels           = labels;
        chart.data.datasets[0].data = diffs;
        chart.update('none');
        if (!data.active) { poller.postMessage({ type: 'stop' }); poller.terminate(); }
      } catch (e) {
        console.error('[Widget]', e);
      }
    }

    fetchAndUpdate();
    poller.postMessage({ type: 'start', intervalMs: POLL_MS });
  })();
  </script>
</body>
</html>
