<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold Widget — Current Game</title>
  <script src="/static/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    canvas { display: block; position: fixed; inset: 0; width: 100% !important; height: 100% !important; }
    #overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #475569; font-size: 1rem;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="app" data-smooth="{{SMOOTH}}"></div>
  <canvas id="goldChart"></canvas>
  <div id="overlay">Waiting for active game…</div>

  <script>
  (function () {
    'use strict';

    const SMOOTH       = document.getElementById('app').dataset.smooth === '1';
    const DATA_POLL_MS = 5000;
    const UUID_POLL_MS = 2000;

    // ── Gaussian smoothing ────────────────────────────────────────────────────

    function gaussianSmooth(data, windowSize, sigma) {
      windowSize = windowSize || 15;
      sigma      = sigma      || 5;
      if (!data.length) return [];
      const half   = Math.floor(windowSize / 2);
      const kernel = [];
      let ksum = 0;
      for (let i = 0; i < windowSize; i++) {
        const x = i - half;
        const v = Math.exp(-(x * x) / (2 * sigma * sigma));
        kernel.push(v); ksum += v;
      }
      for (let i = 0; i < kernel.length; i++) kernel[i] /= ksum;
      return data.map(function (_, i) {
        let wSum = 0, wTotal = 0;
        for (let j = 0; j < windowSize; j++) {
          const idx = i - half + j;
          if (idx < 0 || idx >= data.length) continue;
          wSum += data[idx] * kernel[j]; wTotal += kernel[j];
        }
        return wTotal > 0 ? wSum / wTotal : 0;
      });
    }

    function formatTime(t, duration) {
      if (duration < 120)  return t + 's';
      if (duration < 600)  return Math.floor(t / 60) + 'min';
      return Math.floor(t / 300) * 5 + 'min';
    }

    // ── Chart ─────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('goldChart');
    const ctx    = canvas.getContext('2d');

    function syncSize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    syncSize();

    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels:   [],
        datasets: [{
          data:        [],
          borderWidth: 2,
          pointRadius: 0,
          tension:     0,
          fill: {
            target: { value: 0 },
            above:  'rgba(59,130,246,0.15)',
            below:  'rgba(239,68,68,0.15)',
          },
          segment: {
            borderColor: function (c) {
              return c.p0.parsed.y >= 0 ? '#3b82f6' : '#ef4444';
            },
          },
        }],
      },
      options: {
        responsive:          false,
        animation:           false,
        maintainAspectRatio: false,
        layout: { padding: 16 },
        interaction: { intersect: false, mode: 'index' },
        scales: {
          x: {
            type:  'category',
            ticks: { maxTicksLimit: 12, autoSkip: true, color: '#64748b', maxRotation: 0 },
            grid:  { color: '#1e293b' },
          },
          y: {
            ticks: {
              color: '#64748b',
              callback: function (v) {
                return (Number(v) > 0 ? '+' : '') + Number(v).toFixed(1) + 'k';
              },
            },
            grid: {
              color: function (c) {
                return c.tick.value === 0 ? '#475569' : '#1e293b';
              },
            },
            afterDataLimits: function (scale) {
              const extent = Math.max(1, scale.max, -scale.min);
              scale.max =  extent;
              scale.min = -extent;
            },
          },
        },
        plugins: {
          legend:  { display: false },
          tooltip: {
            backgroundColor: '#1e293b',
            borderColor:     '#334155',
            borderWidth:     1,
            titleColor:      '#94a3b8',
            bodyColor:       '#e2e8f0',
            callbacks: {
              title: function (items) { return items[0].label; },
              label: function (c) {
                const v = c.parsed.y;
                return (v > 0 ? 'Blue +' : 'Red +') + Math.abs(v).toFixed(1) + 'k';
              },
            },
          },
        },
      },
    });

    window.addEventListener('resize', function () {
      syncSize();
      chart.resize(window.innerWidth, window.innerHeight);
    });

    // ── State ─────────────────────────────────────────────────────────────────

    let currentUUID = null;

    function setOverlay(msg) {
      const el = document.getElementById('overlay');
      el.textContent   = msg;
      el.style.display = msg ? 'flex' : 'none';
    }

    function clearChart() {
      chart.data.labels           = [];
      chart.data.datasets[0].data = [];
      chart.update('none');
    }

    // ── Unthrottled pollers via Web Workers ───────────────────────────────────

    let dataPoller = new Worker('/static/poll-worker.js');
    const uuidPoller = new Worker('/static/poll-worker.js');

    dataPoller.onmessage = function (e) { if (e.data.type === 'tick') fetchData(); };
    uuidPoller.onmessage = function (e) { if (e.data.type === 'tick') pollUUID(); };

    window.addEventListener('beforeunload', function () {
      dataPoller.terminate();
      uuidPoller.terminate();
    });

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') { pollUUID(); fetchData(); }
    });

    // ── Data fetching ─────────────────────────────────────────────────────────

    async function fetchData() {
      if (!currentUUID) return;
      try {
        const res  = await fetch('/api/graph/' + currentUUID + '/data');
        const data = await res.json();
        if (!data.readings || !data.readings.length) return;
        const rawDiffs = data.readings.map(function (r) { return r.diff; });
        const diffs    = SMOOTH ? gaussianSmooth(rawDiffs) : rawDiffs;
        const duration = data.readings[data.readings.length - 1].t;
        const labels   = data.readings.map(function (r) { return formatTime(r.t, duration); });
        chart.data.labels           = labels;
        chart.data.datasets[0].data = diffs;
        chart.update('none');
        setOverlay('');
      } catch (e) {
        console.error('[Widget/current] data fetch error:', e);
      }
    }

    // ── UUID polling ──────────────────────────────────────────────────────────

    async function pollUUID() {
      try {
        const res  = await fetch('/api/session/status');
        const data = await res.json();
        const uuid = data.activeGameUUID || null;

        if (uuid !== currentUUID) {
          currentUUID = uuid;
          clearChart();
          dataPoller.terminate();
          dataPoller = new Worker('/static/poll-worker.js');
          dataPoller.onmessage = function (e) { if (e.data.type === 'tick') fetchData(); };

          if (uuid) {
            setOverlay('');
            fetchData();
            dataPoller.postMessage({ type: 'start', intervalMs: DATA_POLL_MS });
          } else {
            setOverlay('Waiting for active game…');
          }
        }
      } catch (e) {
        console.error('[Widget/current] status poll error:', e);
      }
    }

    // ── Boot ──────────────────────────────────────────────────────────────────

    pollUUID();
    uuidPoller.postMessage({ type: 'start', intervalMs: UUID_POLL_MS });
  })();
  </script>
</body>
</html>
